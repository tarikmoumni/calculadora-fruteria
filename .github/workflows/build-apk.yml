name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calculadora-fruteria.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-fruteria-apk
          path: calculadora-fruteria.apk

      - name: Publish APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculadora-fruteria.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publicar APK Android"
            git push
          fi
